<!doctype html>
<meta charset="utf-8">
<title>Bicycle Day — morph lab</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; background: #15151c; color: #e8e6df; }
  header { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 14px; align-items: center; padding: 10px 16px; background: #1d1d27; border-bottom: 1px solid #33333f; }
  header label { display: flex; gap: 6px; align-items: center; }
  header .t { font-variant-numeric: tabular-nums; color: #b8b6c4; min-width: 150px; }
  main { padding: 14px 16px 60px; display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; align-items: start; }
  @media (max-width: 1000px) { main { grid-template-columns: 1fr; } }
  h2 { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: #9a98a8; margin: 16px 0 8px; }
  h2:first-child { margin-top: 0; }
  button, select, .btn { background: #2a2a38; color: inherit; border: 1px solid #44445a; border-radius: 6px; padding: 5px 10px; font: inherit; cursor: pointer; }
  button:hover, .btn:hover { background: #34344a; }
  button.on { background: #3b7a57; border-color: #5cf08a; }
  .stage { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 8px; overflow: hidden; }
  canvas#cv { width: 100%; height: 100%; display: block; }
  .drop { position: absolute; inset: 0; display: none; grid-template-columns: 1fr 1fr; background: rgba(21, 21, 28, .55); }
  .drop.on { display: grid; }
  .drop div { display: flex; align-items: center; justify-content: center; font-size: 28px; border: 2px dashed #5a5a74; margin: 12px; border-radius: 10px; }
  .drop div.hot { background: rgba(92, 240, 138, .18); border-color: #5cf08a; }
  .scrub { display: flex; gap: 10px; align-items: center; margin-top: 8px; }
  .scrub input { flex: 1; }
  canvas#chart { width: 100%; height: 90px; display: block; margin-top: 6px; background: #101016; border: 1px solid #2c2c3a; border-radius: 6px; cursor: pointer; }
  .panel { background: #1d1d27; border: 1px solid #2c2c3a; border-radius: 10px; padding: 12px 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips button { padding: 4px 9px; }
  .durs { margin: -2px 0 8px 120px; }
  .durs button { flex: 1; padding: 4px 0; }
  .sl { display: grid; grid-template-columns: 112px 1fr 44px; gap: 8px; align-items: center; font-size: 12px; color: #b8b6c4; margin: 4px 0; }
  .sl input { width: 100%; margin: 0; }
  .sl b { font-weight: normal; text-align: right; color: #e8e6df; font-variant-numeric: tabular-nums; }
  .ck { display: flex; gap: 8px; align-items: center; font-size: 12px; color: #b8b6c4; margin: 6px 0; }
  .ck select { padding: 3px 6px; font-size: 12px; }
  .img { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: center; margin: 5px 0; }
  .img b { color: #9a98a8; }
  .img select { min-width: 0; width: 100%; font-size: 12px; padding: 4px 6px; }
  .btn { font-size: 12px; padding: 4px 9px; }
  .btn input { display: none; }
  .row { display: flex; gap: 6px; margin-top: 8px; }
  textarea { width: 100%; box-sizing: border-box; height: 120px; background: #101016; color: #cfd; border: 1px solid #33333f; border-radius: 6px; font: 12px monospace; }
  .hint { color: #8a889a; font-size: 12px; margin: 6px 0 0; }
  .hint.warn { color: #e8b86a; }
  #msl, #csl, #ssl { margin-top: 8px; }
  .sub { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: #8a889a; margin: 12px 0 2px; }
</style>
<header>
  <button id="play">▶ Play</button>
  <button id="loop" class="on">Loop</button>
  <button id="swap">⇄ Swap A/B</button>
  <span class="chips" id="views"></span>
  <span class="t" id="tl"></span>
</header>
<main>
  <section>
    <div class="stage" id="stage"><canvas id="cv" width="1280" height="720"></canvas>
      <div class="drop" id="drop"><div id="dA">A</div><div id="dB">B</div></div></div>
    <div class="scrub"><span class="hint" style="margin:0">time</span><input id="scrub" type="range" min="0" max="1000" step="1" value="0"></div>
    <canvas id="chart" width="1280" height="90"></canvas>
    <p class="hint">m = share of B over the loop (white line = playhead, dashed = stage levels). Click the chart or drag the slider to scrub. Drop images on the canvas: left half = A, right half = B.</p>
    <p class="hint" id="hint"></p>
  </section>
  <aside>
    <div class="panel">
      <h2>Images</h2>
      <div class="img"><b>A</b><select id="selA"></select><label class="btn">File…<input type="file" accept="image/*" id="fA"></label></div>
      <div class="img"><b>B</b><select id="selB"></select><label class="btn">File…<input type="file" accept="image/*" id="fB"></label></div>
      <h2>Mask</h2>
      <div class="chips" id="modes"></div>
      <div id="msl"></div>
      <h2>Common</h2>
      <div id="csl"></div>
      <h2>Stages</h2>
      <div class="chips" id="nst"></div>
      <div id="ssl"></div>
      <h2>Settings</h2>
      <textarea id="json" spellcheck="false"></textarea>
      <div class="row"><button id="copy">Copy JSON</button><button id="imp">Import</button><button id="rst">Reset</button></div>
    </div>
  </aside>
</main>
<script>
// Morph lab (T165): tune a two-image morph by eye. Standalone, not part of the build.
// Modes (chip number = id): 1 Focus pull, 2 Organic dissolve, 3 Shape-guided, 4 Colour first, 5 Liquid morph, 6 Iris, 7 Cells. (Old settings without v:2 had 1 = Light wipe, removed: it loads as 2.)
// Test hook: ?m=<0..1>&mode=<1..7>&view=<0..2>&clk=<s>&a=<file>&b=<file> freeze the progress; window.__lab.set({...}) does the same at run time.
const $ = id => document.getElementById(id), cl = (x, a, b) => Math.min(b, Math.max(a, x)), ss = x => x * x * (3 - 2 * x);
const W = 1280, H = 720, LW = 320, LH = 180, LN = 1024;
const GAL = ['poster.jpg', 'manet-dejeuner-sur-lherbe.jpg', 'bosch-garden-of-earthly-delights.jpg', 'bruegel-fall-of-the-rebel-angels.jpg', 'hirschl-souls-at-the-acheron.jpg', 'huys-temptation-of-saint-anthony.jpg'];
const MODES = ['Focus pull', 'Organic dissolve', 'Shape-guided', 'Colour first', 'Liquid morph', 'Iris', 'Cells'], VIEWS = ['Normal', 'Mask s', 'Switch k'];
const DEF = { mode: 2, soft: .25, nmix: .15, motion: .3, dur: 60, eq: 1, cal: 1, v: 2, eblur: 24, scale: 3.5, oct: 4, seed: 7, drift: .2, split: .4, amt: .5, flow: 18, uni: 0,
  fblur: 18, fzoom: .02, funi: 1, icx: .5, icy: .5, inum: 1, iwob: .3, isoft: .5, csize: .14, cjit: .8, cbord: .5, cseam: 0, cord: 0,
  nst: 3, stages: [{ lvl: .3, move: 3, hold: 2 }, { lvl: .6, move: 3, hold: 2 }, { lvl: 1, move: 3, hold: 2 }], endHold: 2, back: 3, endMode: 'back', loop: 1, a: 'poster.jpg', b: 'manet-dejeuner-sur-lherbe.jpg' };
let S = JSON.parse(JSON.stringify(DEF));
// [key, label, min, max, step, decimals, modes (null = all)]
const NZK = ['scale', 'oct', 'seed', 'drift'];   // noise-mask sliders: hidden while the mask is uniform
const PM = [['eblur', 'Edge blur (px)', 1, 40, 1, 0, [3]], ['scale', 'Scale', 1, 16, .1, 1, [1, 2, 4, 5]], ['oct', 'Octaves', 1, 6, 1, 0, [1, 2, 4, 5]],
  ['seed', 'Seed', 0, 99, 1, 0, [1, 2, 4, 5, 6, 7]], ['drift', 'Drift', 0, 1, .01, 2, [1, 2, 4, 5]], ['split', 'Colour split', .05, .95, .01, 2, [4]], ['amt', 'Amount', 0, 1, .01, 2, [5]], ['flow', 'Flow blur (px)', 2, 60, 1, 0, [5]],
  ['fblur', 'Max blur (px)', 0, 60, 1, 0, [1]], ['fzoom', 'Zoom amount', 0, .08, .005, 3, [1]],
  ['icx', 'Centre x', 0, 1, .01, 2, [6]], ['icy', 'Centre y', 0, 1, .01, 2, [6]], ['inum', 'Openings', 1, 4, 1, 0, [6]], ['iwob', 'Edge wobble', 0, 1, .01, 2, [6]], ['isoft', 'Edge softness ×', .2, 3, .05, 2, [6]],
  ['csize', 'Cell size', .04, .4, .005, 3, [7]], ['cjit', 'Jitter', 0, 1, .01, 2, [7]], ['cbord', 'Border softness', 0, 1, .01, 2, [7]], ['cseam', 'Dark seam', 0, 1, .01, 2, [7]]];
const PC = [['soft', 'Softness', .02, .5, .01, 2], ['nmix', 'Noise mix', 0, 1, .01, 2], ['motion', 'Motion', 0, 1, .01, 2], ['dur', 'Duration (s)', 5, 180, 1, 0]];
const ctl = [];   // {inp, val, o, key, dec, vis}
function sl(par, label, o, key, min, max, step, dec, vis) {
  const d = document.createElement('div'); d.className = 'sl';
  d.innerHTML = `<span>${label}</span><input type="range" min="${min}" max="${max}" step="${step}"><b></b>`;
  const c = { inp: d.children[1], val: d.children[2], o, key, dec, d, vis }; ctl.push(c);
  c.inp.oninput = () => { o()[key] = +c.inp.value; c.val.textContent = (+c.inp.value).toFixed(dec); touch(); };
  par.append(d); return c;
}
function ck(par, label, key, vis) {
  const d = document.createElement('label'); d.className = 'ck'; d.innerHTML = `<input type="checkbox"><span>${label}</span>`;
  const c = { inp: d.children[0], key, d, vis, chk: 1 }; ctl.push(c); c.inp.onchange = () => { S[key] = c.inp.checked ? 1 : 0; touch(); }; par.append(d);
}
function sel(par, label, key, opts, vis) {
  const d = document.createElement('label'); d.className = 'ck'; d.innerHTML = `<span>${label}</span><select>${opts.map((o, i) => `<option value="${i}">${o}</option>`).join('')}</select>`;
  const c = { inp: d.children[1], key, d, vis, sel: 1 }; ctl.push(c); c.inp.onchange = () => { S[key] = +c.inp.value; touch(); }; par.append(d);
}
function chips(par, names, get, set, first = 0) {
  par.innerHTML = ''; names.forEach((n, i) => { const b = document.createElement('button'); b.textContent = n; b.onclick = () => { set(i + first); syncUI(); touch(); }; par.append(b); });
  return () => [...par.children].forEach((b, i) => b.classList.toggle('on', get() === i + first));
}
let upChips = [];
function setDur(v) { const o = S.dur; if (v !== o) { S.dur = v; if (o > 0) tp = tp * v / o; } dirty = true; touch(); }
function build() {
  upChips = [chips($('modes'), MODES.map((n, i) => (i + 1) + ' ' + n), () => S.mode, v => S.mode = v, 1), chips($('views'), VIEWS, () => view, v => view = v), chips($('nst'), ['1', '2', '3'], () => S.nst, v => S.nst = v, 1)];
  const m = $('msl'), c = $('csl'), s = $('ssl');
  ck(m, 'Uniform mask (no noise)', 'uni', () => S.mode === 5); ck(m, 'Whole picture together (uniform mask)', 'funi', () => S.mode === 1);
  for (const [k, l, a, b, st, dec, md] of PM) {
    sl(m, l, () => S, k, a, b, st, dec, () => md.includes(S.mode) && !(uniNow() && NZK.includes(k)));
    if (k === 'cseam') sel(m, 'Order', 'cord', ['Random', 'From centre', 'Top-down'], () => S.mode === 7);
  }
  for (const [k, l, a, b, st, dec] of PC) sl(c, l, () => S, k, a, b, st, dec);
  // duration: slider and chips both go through setDur (keeps the playhead at the same relative position)
  const dc = ctl.find(x => x.key === 'dur'); dc.inp.oninput = () => setDur(+dc.inp.value);
  const dr = document.createElement('div'); dr.className = 'chips durs'; c.append(dr);
  const DURS = [5, 10, 30, 60];
  for (const v of DURS) { const b = document.createElement('button'); b.textContent = v + ' s'; b.onclick = () => setDur(v); dr.append(b); }
  upChips.push(() => [...dr.children].forEach((b, i) => b.classList.toggle('on', S.dur === DURS[i])));
  ck(c, 'Equalise mask (spread s evenly)', 'eq'); ck(c, 'Calibrate m (stage .3 = ~30 % of B)', 'cal');
  const e = document.createElement('label'); e.className = 'ck'; e.innerHTML = `<span>At the end</span><select id="endm"><option value="back">Morph back B to A</option><option value="swap">Swap A/B, restart</option><option value="cut">Hard restart</option></select>`;
  c.append(e); $('endm').onchange = () => { S.endMode = $('endm').value; touch(); };
  for (let i = 0; i < 3; i++) {
    const g = () => S.stages[i], v = () => i < S.nst;
    const h = document.createElement('div'); h.className = 'sub'; h.textContent = 'Stage ' + (i + 1); s.append(h); ctl.push({ d: h, vis: v });
    sl(s, 'Level', g, 'lvl', 0, 1, .01, 2, v); sl(s, 'Move', g, 'move', 0, 10, .1, 1, v); sl(s, 'Hold', g, 'hold', 0, 10, .1, 1, v);
  }
  const h = document.createElement('div'); h.className = 'sub'; h.textContent = 'End (weights; the loop is spread over the duration)'; s.append(h);
  sl(s, 'Hold at 1', () => S, 'endHold', 0, 10, .1, 1); sl(s, 'Back to A', () => S, 'back', 0, 10, .1, 1, () => S.endMode === 'back');
}
function syncUI() {
  for (const c of ctl) {
    if (c.sel) c.inp.value = S[c.key];
    else if (c.inp && !c.chk) { const v = c.o()[c.key]; c.inp.value = v; c.val.textContent = (+v).toFixed(c.dec); }
    if (c.chk) c.inp.checked = !!S[c.key];
    if (c.vis) c.d.style.display = c.vis() ? '' : 'none';
  }
  // last stage always ends at 1
  for (const c of ctl) if (c.key === 'lvl') { const i = ctl.filter(x => x.key === 'lvl').indexOf(c); if (i === S.nst - 1) { c.inp.value = 1; c.val.textContent = '1.00'; c.inp.disabled = true; } else c.inp.disabled = false; }
  $('endm').value = S.endMode; $('loop').classList.toggle('on', !!S.loop); upChips.forEach(f => f());
  $('selA').value = S.a || ''; $('selB').value = S.b || '';
}
// ── time curve
function segs() {
  const st = S.stages.slice(0, S.nst), L = []; let prev = 0;
  st.forEach((s, i) => { const lv = i === st.length - 1 ? 1 : cl(s.lvl, 0, 1); L.push({ w: s.move, a: prev, b: lv }, { w: s.hold, a: lv, b: lv }); prev = lv; });
  L.push({ w: S.endHold, a: 1, b: 1 }); if (S.endMode === 'back') L.push({ w: S.back, a: 1, b: 0 });
  const tot = L.reduce((a, x) => a + x.w, 0) || 1; let t = 0; for (const x of L) { x.t0 = t; t += x.w / tot * S.dur; x.t1 = t; }
  return L.filter(x => x.w > 0);
}
function mAt(L, t) { for (const g of L) if (t < g.t1) return g.a + (g.b - g.a) * ss(cl((t - g.t0) / (g.t1 - g.t0), 0, 1)); return L.length ? L[L.length - 1].b : 0; }
// ── GL
const cv = $('cv'), gl = cv.getContext('webgl2', { preserveDrawingBuffer: true, antialias: false });
const VS = `#version 300 es
void main(){ vec2 p = vec2(gl_VertexID & 1, gl_VertexID >> 1) * 4. - 1.; gl_Position = vec4(p, 0, 1); }`;
const FS_C = `#version 300 es
precision highp float; uniform sampler2D uS; uniform vec2 uFit, uRes; out vec4 o;
void main(){ vec2 q = (gl_FragCoord.xy / uRes - .5) / uFit + .5; o = (q.x < 0. || q.y < 0. || q.x > 1. || q.y > 1.) ? vec4(0, 0, 0, 1) : vec4(texture(uS, q).rgb, 1); }`;
const FS_M = `#version 300 es
precision highp float;
uniform sampler2D uA, uB, uLut;
uniform vec2 uRes, uFit, uPan;
uniform float uZoom, uT, uM, uK, uSoft, uNmix, uEq, uEblur, uScale, uOct, uSeed, uDrift, uSplit, uAmt, uFlow, uUni;
uniform float uFblur, uFzoom, uIcx, uIcy, uInum, uIwob, uCsize, uCjit, uCbord, uCseam, uCord;
uniform vec3 uMuA, uSdA, uMuB, uSdB;
uniform int uMode, uView, uLutPass;
out vec4 o;
const float AS = 16. / 9.; const vec2 PX = vec2(1280., 720.);
float h3(vec3 p){ p = fract(p * .1031); p += dot(p, p.zyx + 31.32); return fract((p.x + p.y) * p.z); }
float vn(vec3 p){ vec3 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f);
  return mix(mix(mix(h3(i), h3(i + vec3(1,0,0)), f.x), mix(h3(i + vec3(0,1,0)), h3(i + vec3(1,1,0)), f.x), f.y),
             mix(mix(h3(i + vec3(0,0,1)), h3(i + vec3(1,0,1)), f.x), mix(h3(i + vec3(0,1,1)), h3(i + vec3(1,1,1)), f.x), f.y), f.z); }
float fbm(vec2 p, float z, float oct){ float a = .5, s = 0., n = 0.;
  for (int i = 0; i < 6; i++){ if (float(i) >= oct) break; s += a * vn(vec3(p, z)); n += a; p = p * 2.02 + vec2(5.2, 1.3); z = z * 1.5 + .7; a *= .5; } return s / n; }
float L(vec3 c){ return dot(c, vec3(.299, .587, .114)); }
float lodL(sampler2D t, vec2 uv, float lod){ return L(textureLod(t, uv, lod).rgb); }
float edgeS(vec2 uv){   // Sobel on a blurred B
  float d = max(uEblur, 1.), lod = log2(d); vec2 e = vec2(d) / PX;
  float a = lodL(uB, uv + vec2(-e.x, e.y), lod), b = lodL(uB, uv + vec2(0, e.y), lod), c = lodL(uB, uv + e, lod), dd = lodL(uB, uv + vec2(-e.x, 0), lod),
        f = lodL(uB, uv + vec2(e.x, 0), lod), g = lodL(uB, uv - e, lod), h = lodL(uB, uv - vec2(0, e.y), lod), i = lodL(uB, uv + vec2(e.x, -e.y), lod);
  return length(vec2((c + 2. * f + i) - (a + 2. * dd + g), (a + 2. * b + c) - (g + 2. * h + i))); }
float edgeR(vec2 uv){   // spread: average the Sobel on a hex ring so edges become bands, not speckle
  vec2 r = vec2(max(uEblur, 1.) * 1.5) / PX; float s = edgeS(uv);
  for (int i = 0; i < 6; i++){ float a = float(i) * 1.0472; s += edgeS(uv + r * vec2(cos(a), sin(a))); } return s / 7.; }
vec2 grad(sampler2D t, vec2 uv){
  float d = uFlow, lod = log2(max(d, 1.)); vec2 e = vec2(d) / PX;
  vec2 g = 3. * vec2(lodL(t, uv + vec2(e.x, 0), lod) - lodL(t, uv - vec2(e.x, 0), lod), lodL(t, uv + vec2(0, e.y), lod) - lodL(t, uv - vec2(0, e.y), lod));
  return g / max(1., length(g)); }
// Iris: s = distance to the nearest of up to 4 openings (smooth union), radius wobbled by slow angular noise
vec2 irisC(int i){ return i == 0 ? vec2(uIcx, uIcy) : vec2(.3 + .4 * h3(vec3(float(i), uSeed, 1.7)), .15 + .7 * h3(vec3(float(i), uSeed, 5.3))); }
float smin(float a, float b, float k){ float h = max(k - abs(a - b), 0.) / k; return min(a, b) - h * h * k * .25; }
float irisF(vec2 uv){
  vec2 p = uv * vec2(AS, 1.), cr[4] = vec2[4](vec2(0., 0.), vec2(AS, 0.), vec2(0., 1.), vec2(AS, 1.)); float d = 9., dn = 0.;
  for (int j = 0; j < 4; j++){ float m = 9.; for (int i = 0; i < 4; i++){ if (float(i) >= uInum) break; m = min(m, length(cr[j] - irisC(i) * vec2(AS, 1.))); } dn = max(dn, m); }
  for (int i = 0; i < 4; i++){ if (float(i) >= uInum) break;
    vec2 v = p - irisC(i) * vec2(AS, 1.); float l = length(v); vec2 dir = v / max(l, 1e-4);
    float n = fbm(dir * 1.4 + float(i) * 3.7 + uSeed * .9, uSeed * .31 + uT * .05, 2.);
    float di = l * (1. + uIwob * .6 * (2. * n - 1.)); d = d > 8. ? di : smin(d, di, .12); }
  return clamp(d / (dn * 1.15), 0., 1.); }
// Cells: jittered Voronoi, each cell has its own switch time; times are blended near borders (compact kernel) so s is continuous
// .x = smooth switch time, .y = d2 - d1 in cell units (0 on a border)
vec2 cpt(vec2 id){ return id + .5 + (vec2(h3(vec3(id, uSeed + 3.1)), h3(vec3(id, uSeed + 8.7))) - .5) * uCjit; }
float ctime(vec2 id, vec2 p){
  float r = h3(vec3(id, uSeed + 14.3)); if (uCord < .5) return r;
  vec2 u = p * uCsize / vec2(AS, 1.);
  float x = uCord < 1.5 ? length((u - .5) * vec2(AS, 1.)) / .95 : 1. - u.y;
  return clamp(.85 * clamp(x, 0., 1.) + .15 * r, 0., 1.); }
vec2 cellsF(vec2 uv){
  vec2 q = uv * vec2(AS, 1.) / uCsize, i0 = floor(q); float d1 = 9., d2 = 9.;
  for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++){ float d = length(cpt(i0 + vec2(i, j)) - q); if (d < d1){ d2 = d1; d1 = d; } else d2 = min(d2, d); }
  float bw = .03 + uCbord * .57, sw = 0., sv = 0.; int R = bw > .27 ? 2 : 1;
  for (int j = -2; j <= 2; j++) for (int i = -2; i <= 2; i++){ if (abs(i) > R || abs(j) > R) continue;
    vec2 id = i0 + vec2(i, j), p = cpt(id); float w = max(0., 1. - (length(p - q) - d1) / bw); w *= w; sw += w; sv += w * ctime(id, p); }
  return vec2(sv / sw, d2 - d1); }
// Focus pull: disc of mip-mapped taps (fractional lod = trilinear blend of adjacent mips), image scaled around the centre
